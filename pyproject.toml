[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hook-management-system"
version = "3.13.0"
description = "Desktop and CLI workflow for preparing music hooks and DaVinci Resolve timelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "numpy>=1.23.5,<2.0.0",
    "scipy>=1.10.1",
]

[project.scripts]
hms = "hms_master_gui:main"

[tool.setuptools]
py-modules = [
    "hms_manifest",
    "hms_master_gui",
    "hms_metadata",
    "hms_safety",
    "hms_v31_patcher",
]
