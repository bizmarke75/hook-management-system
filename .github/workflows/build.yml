name: Build and Release HMS Portable Binary

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Audit Runtime Environment
        shell: powershell
        run: |
          python -c "import soundfile, librosa, scipy, numpy, tkinter; print('[SUCCESS] HMS runtime dependencies loaded cleanly.')"

      - name: Build Standalone Executable
        shell: powershell
        run: |
          python build_exe.py

      - name: Verify Binary Exists
        shell: powershell
        run: |
          $exePath = "dist\hms_master_gui\hms_master_gui.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "[FATAL] Build failed: $exePath not found."
            exit 1
          }
          Write-Host "[SUCCESS] Executable verified at $exePath" -ForegroundColor Green

      - name: Package Portable ZIP
        shell: powershell
        run: |
          $distFolder = "dist\hms_master_gui"
          $zipOutput = "dist\HMS_${{ github.ref_name }}_Portable.zip"
          Compress-Archive -Path "$distFolder\*" -DestinationPath $zipOutput -Force

      - name: Upload Binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HMS_*_Portable.zip
          name: "Hook Management System ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
