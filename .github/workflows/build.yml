name: Build and Release HMS Portable Binary

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install build

      - name: Audit Runtime Environment
        shell: powershell
        run: |
          python -c "import soundfile, librosa, scipy, numpy, tkinter; print('[SUCCESS] HMS runtime dependencies loaded cleanly.')"

      - name: Build Standalone Executable
        shell: powershell
        run: |
          python build_exe.py

      - name: Verify Binary Exists
        shell: powershell
        run: |
          $exePath = "dist\hms_master_gui\hms_master_gui.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "[FATAL] Build failed: $exePath not found."
            exit 1
          }
          Write-Host "[SUCCESS] Executable verified at $exePath" -ForegroundColor Green

      - name: Package Portable ZIP
        shell: powershell
        run: |
          $distFolder = "dist\hms_master_gui"
          $zipOutput = "dist\HMS_${{ github.ref_name }}_Portable.zip"
          Compress-Archive -Path "$distFolder\*" -DestinationPath $zipOutput -Force

      - name: Build Python Distributions
        shell: powershell
        run: |
          python -m build --sdist --wheel --outdir dist\python

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Build Windows Installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "[FATAL] Inno Setup compiler not found at $iscc"
            exit 1
          }
          & $iscc "/DAppVersion=$version" "installer\HMS.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify Release Packages
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $requiredFiles = @(
            "dist\HMS_${{ github.ref_name }}_Portable.zip",
            "dist\HMS_${{ github.ref_name }}_Setup.exe"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "[FATAL] Release package missing: $file"
              exit 1
            }
          }
          if (-not (Get-ChildItem "dist\python" -Filter "*.whl" -File)) {
            Write-Error "[FATAL] Python wheel was not built."
            exit 1
          }
          if (-not (Get-ChildItem "dist\python" -Filter "*.tar.gz" -File)) {
            Write-Error "[FATAL] Python source archive was not built."
            exit 1
          }

      - name: Upload Release Packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HMS_*_Portable.zip
            dist/HMS_*_Setup.exe
            dist/python/*
          name: "Hook Management System ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
