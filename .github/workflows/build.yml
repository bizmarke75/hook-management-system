name: Build and Release HMS Portable Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install soundfile librosa numpy scipy pyinstaller

      - name: Audit Working Environment
        run: |
          python -c "import soundfile, librosa, scipy, numpy, tkinter; print('[SUCCESS] Python audio dependencies loaded cleanly.')"

      - name: Compile Standalone Executable via PyInstaller
        run: |
          pyinstaller hms_master_gui.spec --noconfirm --clean

      - name: Verify Binary & Dynamic Audio Libraries
        shell: pwsh
        run: |
          $exePath = "dist\hms_master_gui\hms_master_gui.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "[FATAL] Compilation failed: $exePath not found."
            exit 1
          }
          Write-Host "[SUCCESS] Executable verified: $exePath" -ForegroundColor Green

          $sndfileDlls = Get-ChildItem -Path "dist\hms_master_gui" -Filter "*sndfile*" -Recurse
          if ($sndfileDlls) {
            Write-Host "[SUCCESS] SoundFile dynamic C-libraries found in build output:" -ForegroundColor Green
            $sndfileDlls | Select-Object Name, Length, FullName | Format-Table -AutoSize
          } else {
            Write-Warning "[WARN] libsndfile DLL not explicitly matched in root; checking internal packages..."
          }

      - name: Package Portable Distribution ZIP
        shell: pwsh
        run: |
          $distFolder = "dist\hms_master_gui"
          $zipOutput  = "dist\HMS_${{ github.ref_name }}_Portable.zip"
          Write-Host "[RUN] Compressing $distFolder into $zipOutput..." -ForegroundColor Cyan
          Compress-Archive -Path "$distFolder\*" -DestinationPath $zipOutput -Force
          $sizeMb = [math]::Round((Get-Item $zipOutput).Length / 1MB, 2)
          Write-Host "[SUCCESS] Created portable archive: $zipOutput ($sizeMb MB)" -ForegroundColor Green

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HMS_*_Portable.zip
          name: "Hook Management System ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}